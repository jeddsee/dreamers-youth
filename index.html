<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamers Youth</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { background: #000; }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--s-6) var(--s-4);
      background: #000;
    }

    .login-card {
      background: rgba(255, 53, 0, 0.92);
      border-radius: var(--r-lg);
      padding: var(--s-5) var(--s-6) var(--s-6);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgb(255 53 0 / .4);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }

    .login-logo {
      text-align: center;
      margin-bottom: var(--s-4);
    }
    .login-logo img {
      width: 340px;
      height: auto;
      display: block;
      margin: -52px auto -16px;
      mix-blend-mode: screen;
    }
    .login-logo__name {
      font-size: var(--text-2xl);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: var(--s-1);
    }
    .login-logo__sub {
      font-size: var(--text-sm);
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.01em;
    }

    /* White text inside card */
    .login-card label,
    .login-card .form-group label { color: #fff; }

    .visitor-link {
      text-align: center;
      margin-top: var(--s-6);
      padding-top: var(--s-6);
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .visitor-link p {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.75);
      margin-bottom: var(--s-3);
    }

    /* Continue button: white on red card */
    .login-card .btn--primary {
      background: #fff;
      color: #ff3500;
    }
    .login-card .btn--primary:hover:not(:disabled) { background: #f0f0f0; }

    /* Ghost button: white outline */
    .login-card .btn--ghost {
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }
    .login-card .btn--ghost:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* Error banner adjusted for dark card */
    .login-card .error-banner {
      background: rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* Searchable name combobox */
    .combobox { position: relative; }
    .combobox__list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid var(--c-border-dark);
      border-radius: var(--r);
      max-height: 260px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 50;
      list-style: none;
      box-shadow: var(--shadow-md);
      padding: var(--s-1) 0;
    }
    .combobox__list.hidden { display: none; }
    .combobox__list li {
      padding: var(--s-2) var(--s-3);
      cursor: pointer;
      font-size: var(--text-sm);
      color: var(--c-text);
    }
    .combobox__list li:hover,
    .combobox__list li[aria-selected="true"] {
      background: var(--c-primary-light);
      color: var(--c-primary-text);
    }
    .combobox__list li.no-results {
      color: var(--c-text-muted);
      cursor: default;
      font-size: var(--text-sm);
    }
    .combobox__list li.no-results:hover { background: none; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="dy-logo-white.png" alt="Dreamers Youth">
        <div class="login-logo__name">Dreamers Youth</div>
        <div class="login-logo__sub">Pastoral Management System</div>
      </div>

      <div id="error-banner" class="error-banner hidden" style="margin-bottom:var(--s-4)"></div>

      <form id="login-form" class="stack">
        <div class="form-group">
          <label for="campus-select">Campus</label>
          <select id="campus-select" class="select" required>
            <option value="">Select campus…</option>
          </select>
        </div>

        <div class="form-group" id="leader-group" style="display:none">
          <label for="leader-search">Your name</label>
          <div class="combobox" id="leader-combobox">
            <input type="text" id="leader-search" class="input" placeholder="Type to search…" autocomplete="off">
            <ul class="combobox__list hidden" id="leader-list" role="listbox"></ul>
          </div>
        </div>

        <button id="go-btn" type="submit" class="btn btn--primary btn--full" disabled>
          Continue
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
  <script src="shared.js"></script>
  <script>
    const { db } = DY;

    const campusSelect  = document.getElementById('campus-select');
    const leaderGroup   = document.getElementById('leader-group');
    const leaderSearch  = document.getElementById('leader-search');
    const leaderList    = document.getElementById('leader-list');
    const goBtn         = document.getElementById('go-btn');

    let leaders = [];
    let selectedLeader = null; // { id, name, role }

    // ── Load campuses ──────────────────────────────────────────────────────────
    (async () => {
      campusSelect.disabled = true;
      try {
        const { data, error } = await db
          .from('campuses')
          .select('id, name, slug, youth_night_dow')
          .eq('archived', false)
          .order('name');
        if (error) { showError('Could not load campuses.'); campusSelect.disabled = false; return; }
        if (!data?.length) { showError('No campuses found.'); campusSelect.disabled = false; return; }
        data.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id; opt.textContent = c.name;
          opt.dataset.slug = c.slug; opt.dataset.dow = c.youth_night_dow ?? 5;
          campusSelect.appendChild(opt);
        });
      } catch (e) { showError('Unexpected error: ' + e.message); }
      campusSelect.disabled = false;
    })();

    // ── Campus change: load + show name combobox ───────────────────────────────
    campusSelect.addEventListener('change', async () => {
      const campusId = campusSelect.value;
      hideError();
      resetLeader();
      leaderGroup.style.display = 'none';
      goBtn.disabled = true;
      if (!campusId) return;

      campusSelect.disabled = true;
      const { data, error } = await db
        .from('leaders')
        .select('id, name, role')
        .eq('campus_id', campusId)
        .eq('active', true)
        .order('name');
      campusSelect.disabled = false;

      if (error) { showError('Could not load leaders for this campus.'); return; }

      // Sort alphabetically (DB already orders but ensure consistency)
      leaders = (data ?? []).sort((a, b) => a.name.localeCompare(b.name));
      leaderGroup.style.display = '';
      leaderSearch.focus();
    });

    // ── Combobox: filter on input ──────────────────────────────────────────────
    leaderSearch.addEventListener('input', () => {
      const q = leaderSearch.value.trim().toLowerCase();
      renderList(q);
      // If user edits the text, clear any previous selection
      selectedLeader = null;
      goBtn.disabled = true;
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', e => {
      if (!document.getElementById('leader-combobox').contains(e.target)) {
        leaderList.classList.add('hidden');
        // If focus leaves without a valid selection, clear the field
        if (!selectedLeader) leaderSearch.value = '';
      }
    });

    function renderList(query) {
      const matches = query
        ? leaders.filter(l => l.name.toLowerCase().includes(query))
        : leaders;

      leaderList.innerHTML = '';
      if (!matches.length) {
        const li = document.createElement('li');
        li.className = 'no-results'; li.textContent = 'No names found';
        leaderList.appendChild(li);
      } else {
        matches.forEach(l => {
          const li = document.createElement('li');
          li.textContent = l.name;
          li.setAttribute('role', 'option');
          li.addEventListener('mousedown', e => {
            e.preventDefault(); // prevent blur before click
            selectLeader(l);
          });
          leaderList.appendChild(li);
        });
      }
      leaderList.classList.remove('hidden');
    }

    function selectLeader(l) {
      selectedLeader      = l;
      leaderSearch.value  = l.name;
      leaderList.classList.add('hidden');
      goBtn.disabled = false;
    }

    function resetLeader() {
      selectedLeader     = null;
      leaderSearch.value = '';
      leaderList.classList.add('hidden');
      leaders = [];
    }

    // ── Submit ─────────────────────────────────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const campusId        = campusSelect.value;
      const campusName      = campusSelect.selectedOptions[0]?.textContent;
      const youth_night_dow = parseInt(campusSelect.selectedOptions[0]?.dataset.dow ?? '5', 10);
      if (!campusId || !selectedLeader) return;

      setIdentity({
        campus_id:    campusId,
        campus_name:  campusName,
        leader_id:    selectedLeader.id,
        leader_name:  selectedLeader.name,
        role:         selectedLeader.role,
        youth_night_dow,
      });
      window.location.href = selectedLeader.role === 'pastor' ? 'dashboard.html' : 'leader.html';
    });
  </script>
</body>
</html>
