<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamers Youth</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { background: #000; }
    .login-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--s-6) var(--s-4);
      background: #000;
    }

    .login-card {
      background: rgba(0, 0, 255, 0.88);
      border-radius: var(--r-lg);
      padding: var(--s-8) var(--s-6);
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgb(0 0 255 / .35);
      backdrop-filter: blur(8px);
    }

    .login-logo {
      text-align: center;
      margin-bottom: var(--s-8);
    }
    .login-logo img {
      width: 80px;
      height: auto;
      display: block;
      margin: 0 auto;
      mix-blend-mode: multiply;
    }

    /* White text inside card */
    .login-card label,
    .login-card .form-group label { color: #fff; }

    .visitor-link {
      text-align: center;
      margin-top: var(--s-6);
      padding-top: var(--s-6);
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    .visitor-link p {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.75);
      margin-bottom: var(--s-3);
    }

    /* Continue button: white on blue card */
    .login-card .btn--primary {
      background: #fff;
      color: #0000ff;
    }
    .login-card .btn--primary:hover:not(:disabled) { background: #e8e8ff; }

    /* Ghost button: white outline */
    .login-card .btn--ghost {
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }
    .login-card .btn--ghost:hover:not(:disabled) {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* Error banner adjusted for dark card */
    .login-card .error-banner {
      background: rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="dy-logo.png" alt="Dreamers Youth">
      </div>

      <div id="error-banner" class="error-banner hidden" style="margin-bottom:var(--s-4)"></div>

      <form id="login-form" class="stack">
        <div class="form-group">
          <label for="campus-select">Campus</label>
          <select id="campus-select" class="select" required>
            <option value="">Select campus…</option>
          </select>
        </div>

        <div class="form-group" id="leader-group" style="display:none">
          <label for="leader-select">Your name</label>
          <select id="leader-select" class="select" required>
            <option value="">Select name…</option>
          </select>
        </div>

        <button id="go-btn" type="submit" class="btn btn--primary btn--full" disabled>
          Continue
        </button>
      </form>

      <div class="visitor-link">
        <p>New here?</p>
        <a id="register-link" href="register.html" class="btn btn--ghost btn--full btn--sm">
          Register as a new visitor
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
  <script src="shared.js"></script>
  <script>
    const { db } = DY;

    const campusSelect = document.getElementById('campus-select');
    const leaderGroup  = document.getElementById('leader-group');
    const leaderSelect = document.getElementById('leader-select');
    const goBtn        = document.getElementById('go-btn');
    const registerLink = document.getElementById('register-link');

    let leaders = [];

    // Load campuses on page load
    (async () => {
      campusSelect.disabled = true;

      try {
        const { data, error } = await db
          .from('campuses')
          .select('id, name, slug, youth_night_dow')
          .eq('archived', false)
          .order('name');

        if (error) {
          showError('Could not load campuses: ' + (error.message || JSON.stringify(error)));
          campusSelect.disabled = false;
          return;
        }

        if (!data || data.length === 0) {
          showError('No campuses found in the database.');
          campusSelect.disabled = false;
          return;
        }

        data.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = c.name;
          opt.dataset.slug = c.slug;
          opt.dataset.dow  = c.youth_night_dow ?? 5;
          campusSelect.appendChild(opt);
        });
      } catch (e) {
        showError('Unexpected error: ' + e.message);
      }

      campusSelect.disabled = false;
    })();

    // On campus change: load leaders for that campus
    campusSelect.addEventListener('change', async () => {
      const campusId = campusSelect.value;
      hideError();
      leaderSelect.innerHTML = '<option value="">Select name…</option>';
      leaderGroup.style.display = 'none';
      goBtn.disabled = true;

      if (!campusId) return;

      const slug = campusSelect.selectedOptions[0].dataset.slug;
      registerLink.href = `register.html?campus=${slug}`;

      campusSelect.disabled = true;
      const { data, error } = await db
        .from('leaders')
        .select('id, name, role')
        .eq('campus_id', campusId)
        .eq('active', true)
        .order('name');
      campusSelect.disabled = false;

      if (error) { showError('Could not load leaders for this campus.'); return; }

      leaders = data;
      data.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l.id;
        opt.textContent = l.name;
        opt.dataset.role = l.role;
        leaderSelect.appendChild(opt);
      });

      leaderGroup.style.display = '';
    });

    // Enable go button when name is selected
    leaderSelect.addEventListener('change', () => {
      goBtn.disabled = !leaderSelect.value;
    });

    // On submit: store identity and route
    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const campusId   = campusSelect.value;
      const campusName = campusSelect.selectedOptions[0]?.textContent;
      const leaderId   = leaderSelect.value;
      const leaderOpt  = leaderSelect.selectedOptions[0];
      const leaderName = leaderOpt?.textContent;
      const role       = leaderOpt?.dataset.role;

      if (!campusId || !leaderId) return;

      const youth_night_dow = parseInt(campusSelect.selectedOptions[0]?.dataset.dow ?? '5', 10);
      setIdentity({ campus_id: campusId, campus_name: campusName, leader_id: leaderId, leader_name: leaderName, role, youth_night_dow });

      window.location.href = role === 'pastor' ? 'dashboard.html' : 'leader.html';
    });
  </script>
</body>
</html>
