<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Data — Dreamers Youth</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
  <script src="shared.js"></script>
  <style>
    body { background: #0d0d0d; }

    /* ─── CSS vars (same as weekly-data) ─── */
    :root {
      --wd-blue: #1500E8;
      --wd-blue-dim: rgba(21,0,232,0.07);
      --wd-surface: #FFFFFF;
      --wd-border: #E2E2EA;
      --wd-text: #111118;
      --wd-text-muted: #65657A;
      --wd-text-faint: #ABABC0;
      --wd-alt-row: #F8F8FB;
      --wd-section-bg: #EDEDF4;
      --wd-section-text: #8888A0;
      --wd-total-bg: #F4F4FA;
      --wd-shadow: rgba(0,0,20,0.06);
      --wd-leader-bg: #E8E8F8;
      --wd-leader-text: #3030A0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --wd-surface: #1E1E2E;
        --wd-border: #303050;
        --wd-text: #EEEEF8;
        --wd-text-muted: #9090B0;
        --wd-text-faint: #606080;
        --wd-alt-row: #191928;
        --wd-section-bg: #252540;
        --wd-section-text: #7878B0;
        --wd-total-bg: #202038;
        --wd-shadow: rgba(0,0,0,0.3);
        --wd-leader-bg: #222240;
        --wd-leader-text: #9090CC;
      }
    }
    :root[data-theme="dark"] {
      --wd-surface: #1E1E2E;
      --wd-border: #303050;
      --wd-text: #EEEEF8;
      --wd-text-muted: #9090B0;
      --wd-text-faint: #606080;
      --wd-alt-row: #191928;
      --wd-section-bg: #252540;
      --wd-section-text: #7878B0;
      --wd-total-bg: #202038;
      --wd-shadow: rgba(0,0,0,0.3);
      --wd-leader-bg: #222240;
      --wd-leader-text: #9090CC;
    }

    /* ─── Filter bar ─── */
    .wd-filter-bar {
      display: flex;
      align-items: flex-start;
      gap: var(--s-4);
      flex-wrap: wrap;
      margin-bottom: var(--s-6);
    }
    .wd-filter-group { display: flex; flex-direction: column; gap: 6px; }
    .wd-filter-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--c-text-muted);
    }
    .wd-select {
      height: 38px;
      padding: 0 var(--s-3);
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      background: var(--c-surface);
      color: var(--c-text);
      font-size: var(--text-sm);
      cursor: pointer;
      min-width: 110px;
    }

    /* ─── Pills ─── */
    .pill-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pill {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--c-border);
      background: transparent;
      color: var(--c-text-muted);
      font-size: 12px; font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .pill.active {
      background: var(--wd-blue);
      border-color: var(--wd-blue);
      color: #fff;
    }

    /* ─── Term blocks ─── */
    .term-block {
      background: var(--wd-surface);
      border: 1px solid var(--wd-border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .term-header {
      background: var(--wd-blue);
      color: #fff;
      height: 46px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .term-name { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; flex: 1; }
    .term-meta { font-size: 11px; font-weight: 500; opacity: 0.6; margin-right: 6px; }
    .week-controls { display: flex; align-items: center; gap: 7px; }
    .wk-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: transparent; color: #fff;
      font-size: 18px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s, border-color 0.12s;
      padding: 0; padding-bottom: 1px;
    }
    .wk-btn:hover:not(:disabled) { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.7); }
    .wk-btn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* ─── Table ─── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .wd-table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }
    .td-label, .th-label {
      position: sticky; left: 0; z-index: 2;
    }
    .td-label::after, .th-label::after {
      content: '';
      position: absolute;
      top: 0; right: -5px; bottom: 0; width: 5px;
      background: linear-gradient(to right, var(--wd-shadow), transparent);
      pointer-events: none;
    }
    .col-label { width: 220px; }
    .col-week  { width: 72px; }
    .col-total { width: 80px; }

    .wd-table thead tr { border-bottom: 1.5px solid var(--wd-border); }
    .wd-table thead th {
      padding: 9px 10px 8px;
      font-size: 11px; font-weight: 600;
      color: var(--wd-text-muted);
      text-align: right; white-space: nowrap;
      vertical-align: bottom;
      background: var(--wd-surface);
      letter-spacing: 0.01em;
    }
    .th-label {
      text-align: left !important;
      font-size: 11px; font-weight: 700;
      color: var(--wd-text);
      background: var(--wd-surface);
      padding-left: 16px; z-index: 3;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .wk-label { display: block; font-size: 9px; font-weight: 700; color: var(--wd-text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2px; }
    .wk-num { display: block; font-size: 11px; font-weight: 600; color: var(--wd-text); letter-spacing: 0.01em; }
    .th-total { background: var(--wd-total-bg) !important; font-weight: 700; color: var(--wd-text); }

    /* Section row (summary / leader header) */
    .wd-table tr.section-row td {
      background: var(--wd-section-bg);
      padding: 7px 10px 6px 16px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--wd-section-text);
      text-transform: uppercase;
      border-top: 1px solid var(--wd-border);
    }
    .wd-table tr.leader-row td {
      background: var(--wd-leader-bg);
      padding: 7px 10px 6px 16px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--wd-leader-text);
      border-top: 2px solid var(--wd-border);
    }
    .wd-table tr.data-row { border-bottom: 1px solid var(--wd-border); }
    .wd-table tr.data-row:last-child { border-bottom: none; }
    .wd-table tr.data-row td { height: 36px; vertical-align: middle; font-variant-numeric: tabular-nums; }

    .td-label {
      background: var(--wd-surface);
      padding: 0 14px 0 16px;
      font-size: 13px; font-weight: 400;
      color: var(--wd-text);
      white-space: nowrap;
      position: relative;
    }
    .td-label.indent { padding-left: 28px; }
    .wd-table tr.row-alt .td-label { background: var(--wd-alt-row); }

    .td-week {
      text-align: right; padding: 0;
      background: var(--wd-surface); position: relative;
    }
    .wd-table tr.row-alt .td-week { background: var(--wd-alt-row); }

    .td-week .cell-val {
      display: block; text-align: right;
      padding: 0 10px; height: 36px; line-height: 36px;
      font-size: 13px; color: var(--wd-text); white-space: nowrap;
    }
    .td-week .cell-val.empty { color: var(--wd-text-faint); }

    .td-total {
      background: var(--wd-total-bg);
      text-align: right; padding: 0 12px;
      font-variant-numeric: tabular-nums;
      font-size: 13px; font-weight: 700; color: var(--wd-text);
    }
    .td-total.dash { font-weight: 400; color: var(--wd-text-faint); }
    .td-total.zero { color: var(--wd-text-faint); font-weight: 400; }
    .td-total.avg  { font-style: italic; }

    /* ─── Editable cell input ─── */
    .cell-input {
      width: 100%;
      height: 36px;
      border: none;
      background: transparent;
      text-align: right;
      padding: 0 10px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--wd-text);
      outline: none;
      -moz-appearance: textfield;
      box-sizing: border-box;
      display: block;
    }
    .cell-input::-webkit-inner-spin-button,
    .cell-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .cell-input:focus { background: var(--wd-blue-dim); }
    .cell-input:disabled { opacity: 0.5; }

    /* Overdue cell: leader hasn't submitted past Thursday 9pm */
    .td-week.td-overdue .cell-input { color: #cc2a00 !important; font-weight: 700; }
    .td-week.td-overdue .cell-input::placeholder { color: #ff3500; font-weight: 700; }
    .td-week.td-overdue { background: #fff5f2 !important; }

    /* Late submission indicator */
    .td-week { position: relative; }
    .late-toggle {
      position: absolute; top: 2px; right: 2px;
      width: 10px; height: 10px; border-radius: 50%;
      border: none; cursor: pointer; padding: 0;
      background: transparent;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .td-week:hover .late-toggle { opacity: 0.5; }
    .td-week.td-late .late-toggle { opacity: 1; background: #cc2a00; }
    .td-week.td-late .cell-input,
    .td-week.td-late .cell-val { color: #cc2a00 !important; font-weight: 700; }

    /* Edit mode: make cell inputs visually obvious */
    .ld-edit-mode .cell-input { background: var(--wd-blue-dim); outline: 1px solid rgba(21,0,232,0.2); outline-offset: -1px; border-radius: 2px; }

    .wd-status { padding: 48px; text-align: center; color: var(--c-text-muted); font-size: var(--text-sm); }

    /* ─── Leader combobox ─── */
    .leader-combobox { position: relative; }
    .leader-combobox input {
      height: 38px;
      padding: 0 var(--s-3);
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      background: var(--c-surface);
      color: var(--c-text);
      font-size: var(--text-sm);
      min-width: 180px;
      box-sizing: border-box;
    }
    .leader-combobox input:focus { outline: 2px solid var(--wd-blue); outline-offset: -1px; }
    .leader-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--c-surface);
      border: 1px solid var(--c-border-dark);
      border-radius: var(--r);
      max-height: 220px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: var(--shadow-md);
      list-style: none;
      padding: var(--s-1) 0;
    }
    .leader-dropdown.hidden { display: none; }
    .leader-dropdown li {
      padding: var(--s-2) var(--s-3);
      font-size: var(--text-sm);
      cursor: pointer;
      white-space: nowrap;
    }
    .leader-dropdown li:hover, .leader-dropdown li[aria-selected="true"] {
      background: rgba(21,0,232,0.08);
      color: var(--wd-blue);
    }
    .leader-dropdown li.no-match { color: var(--c-text-muted); cursor: default; }
    .leader-dropdown li.no-match:hover { background: none; color: var(--c-text-muted); }

    /* ─── Print ─── */
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .sidebar { display: none !important; }
      .main-content { margin-left: 0 !important; width: 100% !important; }
      .wd-filter-bar, .btn, button, .snap-header-actions { display: none !important; }
      .app-layout { display: block; }
      .week-controls { display: none !important; }
      .term-block { border-radius: 5px !important; margin-bottom: 6mm !important; break-inside: avoid; page-break-inside: avoid; overflow: visible !important; }
      .term-header { height: 32px !important; background: #1500E8 !important; border-radius: 5px 5px 0 0 !important; }
      .table-wrap { overflow: visible !important; }
      .wd-table { width: 100% !important; table-layout: fixed !important; }
      .col-label { width: 140px !important; }
      .col-week  { width: 50px !important; }
      .col-total { width: 60px !important; }
      .wd-table tr.data-row td { height: 22px !important; }
      .wd-table tr.section-row td, .wd-table tr.leader-row td { padding: 4px 6px 3px 10px !important; font-size: 8px !important; background: #EDEDF4 !important; }
      .wd-table thead th { font-size: 9px !important; padding: 6px 4px 5px !important; background: #FFFFFF !important; }
      .th-label { font-size: 9px !important; padding-left: 10px !important; background: #FFFFFF !important; }
      .th-total { background: #F4F4FA !important; }
      .wk-label { font-size: 7px !important; }
      .wk-num { font-size: 8px !important; }
      .td-label { font-size: 9px !important; padding: 0 8px 0 10px !important; background: transparent !important; }
      .td-label.indent { padding-left: 18px !important; }
      .td-label::after { display: none !important; }
      .td-week .cell-val { font-size: 9px !important; height: 22px !important; line-height: 22px !important; padding: 0 4px !important; }
      .td-total { background: #F4F4FA !important; padding: 0 4px !important; font-size: 9px !important; }
      .cell-input { font-size: 9px !important; height: 22px !important; padding: 0 4px !important; }
      /* Print title */
      .snap-header { display: block !important; }
      .snap-header-actions { display: none !important; }
      .snap-title { font-size: 14px !important; }
      .snap-subtitle { font-size: 10px !important; }
    }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <img src="dy-logo-white.png" class="sidebar__logo-img" alt="DY">
      <button class="sidebar-toggle" onclick="DY.toggleSidebar()" title="Toggle sidebar"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,3 4,8 10,13"/></svg></button>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-section__label">Overview</span>
      <a class="sidebar-nav-item" href="dashboard.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        Dashboard
      </a>
      <a class="sidebar-nav-item" href="dashboard.html#yearcomp">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1,11 5,6 9,9 15,3"/><polyline points="1,14 5,9 9,12 15,6"/></svg>
        Time comparison
      </a>
      <a class="sidebar-nav-item" href="weekly-data.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="14" height="4" rx="0.5"/><rect x="1" y="7" width="14" height="4" rx="0.5"/><rect x="1" y="13" width="14" height="2" rx="0.5"/></svg>
        Weekly data
      </a>
      <a class="sidebar-nav-item active" href="listing-data.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="10" y2="12"/></svg>
        Listing data
      </a>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-section__label">Data Entry</span>
      <a class="sidebar-nav-item" href="dashboard.html#entry">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><line x1="8" y1="5" x2="8" y2="11"/><line x1="5" y1="8" x2="11" y2="8"/></svg>
        Weekly entry
      </a>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-section__label">People</span>
      <a class="sidebar-nav-item" href="new-people.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5" r="3"/><path d="M1 13c0-2.8 2.2-5 5-5h0c2.8 0 5 2.2 5 5"/><line x1="12" y1="5" x2="15" y2="5"/><line x1="13.5" y1="3.5" x2="13.5" y2="6.5"/></svg>
        New People
      </a>
      <a class="sidebar-nav-item" href="new-christians.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L9.5 6h4.5l-3.6 2.6 1.4 4.4L8 10.5 4.2 13l1.4-4.4L2 6h4.5z"/></svg>
        New Christians
      </a>
      <a class="sidebar-nav-item" href="leaders.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="4" r="2.5"/><circle cx="11" cy="4" r="2.5"/><path d="M1 13c0-2.2 1.8-4 4-4h2"/><path d="M9 9h2c2.2 0 4 1.8 4 4"/><line x1="11" y1="11" x2="11" y2="15"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
        Leaders
      </a>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-section__label">Admin</span>
      <a class="sidebar-nav-item" href="settings.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M11.54 4.46l-1.41 1.41M4.46 11.54l-1.41 1.41"/></svg>
        Settings
      </a>
    </div>

    <button class="sidebar-logout-icon" onclick="DY.clearIdentity(); window.location.href='/'" title="Sign out">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/><polyline points="11,11 14,8 11,5"/><line x1="14" y1="8" x2="6" y2="8"/></svg>
    </button>
    <div class="sidebar-bottom">
      <span class="sidebar-bottom__label">Campus</span>
      <div class="sidebar-campus-switcher" id="sidebar-campus-switcher"></div>
      <div class="sidebar-bottom__sub" id="sidebar-user">—</div>
      <button class="sidebar-logout" onclick="DY.clearIdentity(); window.location.href='/'">Sign out</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main-content">
    <div class="main-content__body">

      <div class="snap-header">
        <div>
          <h1 class="snap-title">Listing data</h1>
          <div class="snap-subtitle" id="ld-subtitle">Loading…</div>
        </div>
        <div class="snap-header-actions">
          <button id="ld-edit-btn" class="btn btn--outline btn--sm" onclick="toggleLdEditMode()">Edit</button>
          <button class="btn btn--outline btn--sm" id="export-pdf-btn" onclick="exportPDF()">Export PDF</button>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="wd-filter-bar">
        <div class="wd-filter-group">
          <label class="wd-filter-label">Year</label>
          <select id="ld-year" class="wd-select" onchange="onYearChange()"></select>
        </div>
        <div class="wd-filter-group">
          <label class="wd-filter-label">Term</label>
          <div class="pill-row" id="term-pills"></div>
        </div>
        <div class="wd-filter-group">
          <label class="wd-filter-label">Year Level</label>
          <div class="pill-row" id="year-level-pills">
            <button class="pill active" data-yl="all" onclick="toggleYearLevel('all',this)">All</button>
            <button class="pill" data-yl="Year 7" onclick="toggleYearLevel('Year 7',this)">7</button>
            <button class="pill" data-yl="Year 8" onclick="toggleYearLevel('Year 8',this)">8</button>
            <button class="pill" data-yl="Year 9" onclick="toggleYearLevel('Year 9',this)">9</button>
            <button class="pill" data-yl="Year 10" onclick="toggleYearLevel('Year 10',this)">10</button>
            <button class="pill" data-yl="Year 11" onclick="toggleYearLevel('Year 11',this)">11</button>
            <button class="pill" data-yl="Year 12" onclick="toggleYearLevel('Year 12',this)">12</button>
          </div>
        </div>
        <div class="wd-filter-group">
          <label class="wd-filter-label">Gender</label>
          <div class="pill-row" id="gender-pills">
            <button class="pill active" data-g="all" onclick="toggleGender('all',this)">All</button>
            <button class="pill" data-g="Male" onclick="toggleGender('Male',this)">Male</button>
            <button class="pill" data-g="Female" onclick="toggleGender('Female',this)">Female</button>
          </div>
        </div>
        <div class="wd-filter-group">
          <label class="wd-filter-label">Leader</label>
          <div class="leader-combobox" id="leader-combobox">
            <input type="text" id="leader-search" placeholder="All leaders…" autocomplete="off"
              oninput="onLeaderInput()" onfocus="openLeaderDropdown()" onblur="onLeaderBlur()">
            <ul class="leader-dropdown hidden" id="leader-dropdown" role="listbox"></ul>
          </div>
        </div>
      </div>

      <div id="ld-terms">
        <div class="wd-status">Loading…</div>
      </div>

    </div>
  </div>
</div>

<script>
  const { db } = DY;
  const identity = requireIdentity('pastor');
  if (!identity) throw new Error('not authenticated');

  let ldCampus = identity.campus_id;

  // ─── State ───
  let ldYear = new Date().getFullYear();
  let termFilter    = new Set(); // empty = show all 4 terms
  let yearLevelFilter = new Set();
  let genderFilter  = new Set();
  let ldEditMode    = false;

  function toggleLdEditMode() {
    ldEditMode = !ldEditMode;
    const btn = document.getElementById('ld-edit-btn');
    btn.textContent = ldEditMode ? 'Done' : 'Edit';
    btn.classList.toggle('btn--primary', ldEditMode);
    btn.classList.toggle('btn--outline', !ldEditMode);
    document.getElementById('ld-terms').classList.toggle('ld-edit-mode', ldEditMode);
  }

  let allLeaders = [];
  let rosterCount = {};   // leaderId → count of active youth
  let allEntries  = [];   // leader_entries rows
  let termSettingsMap = {}; // termNum → term_settings row
  let noNightDates = new Set(); // entry_dates with no_youth_night = true (kept for fallback date building)
  let noNightByTerm = {};       // termKey → Set of no-night entry_dates
  let noNightWeeks  = {};       // termKey → Set of no-night week_numbers
  let leaderFilter  = null;  // selected leader id, or null for all
  let showInactive  = false; // true = show only inactive leaders

  // ─── Init ───
  async function init() {
    document.getElementById('sidebar-user').textContent = identity.leader_name || '—';

    // Year selector
    const yearSel = document.getElementById('ld-year');
    const currYear = new Date().getFullYear();
    for (let y = currYear + 1; y >= currYear - 3; y--) {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      if (y === currYear) opt.selected = true;
      yearSel.appendChild(opt);
    }
    ldYear = currYear;

    // Term pills — default to current term
    const currentTermStr = termFromDate(new Date());
    const currentTermNum = parseInt(currentTermStr.replace('T',''));
    if (!isNaN(currentTermNum)) termFilter.add(currentTermNum);

    const termPillsEl = document.getElementById('term-pills');
    [1,2,3,4].forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'pill' + (termFilter.has(t) ? ' active' : '');
      btn.dataset.t = t;
      btn.textContent = 'T' + t;
      btn.onclick = () => toggleTerm(t, btn);
      termPillsEl.appendChild(btn);
    });

    // Load campuses and build sidebar switcher
    const { data: campusData } = await db.from('campuses').select('id, name').eq('archived', false).order('name');
    const allCampuses = campusData ?? [];
    const switcher = document.getElementById('sidebar-campus-switcher');
    if (switcher) {
      allCampuses.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'campus-switcher-btn' + (ldCampus === c.id ? ' active' : '');
        btn.textContent = c.name;
        btn.dataset.campusId = c.id;
        btn.onclick = () => {
          ldCampus = c.id;
          document.querySelectorAll('#sidebar-campus-switcher .campus-switcher-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.campusId === ldCampus)
          );
          loadData();
        };
        switcher.appendChild(btn);
      });
    }

    await loadData();
  }

  // ─── Filter toggles ───
  function toggleTerm(t, btn) {
    if (termFilter.has(t)) termFilter.delete(t);
    else termFilter.add(t);
    btn.classList.toggle('active', termFilter.has(t));
    renderAll();
  }

  function toggleYearLevel(val, btn) {
    if (val === 'inactive') {
      showInactive = !showInactive;
      if (showInactive) yearLevelFilter.clear();
    } else if (val === 'all') {
      yearLevelFilter.clear();
      showInactive = false;
    } else {
      if (yearLevelFilter.has(val)) yearLevelFilter.delete(val);
      else yearLevelFilter.add(val);
      showInactive = false;
    }
    document.querySelectorAll('#year-level-pills .pill').forEach(b => {
      const v = b.dataset.yl;
      if (v === 'inactive') b.classList.toggle('active', showInactive);
      else b.classList.toggle('active', v === 'all' ? (yearLevelFilter.size === 0 && !showInactive) : yearLevelFilter.has(v));
    });
    renderAll();
  }

  function toggleGender(val, btn) {
    if (val === 'all') {
      genderFilter.clear();
    } else {
      if (genderFilter.has(val)) genderFilter.delete(val);
      else genderFilter.add(val);
    }
    document.querySelectorAll('#gender-pills .pill').forEach(b => {
      const v = b.dataset.g;
      b.classList.toggle('active', v === 'all' ? genderFilter.size === 0 : genderFilter.has(v));
    });
    renderAll();
  }

  function onYearChange() {
    ldYear = parseInt(document.getElementById('ld-year').value);
    loadData();
  }

  // ─── Leader combobox ───
  function populateLeaderDropdown(query) {
    const list = document.getElementById('leader-dropdown');
    const sorted = sortLeaders(allLeaders.filter(l => {
      if (showInactive ? l.active === false : l.active !== false) return false;
      const yrs = getLeaderYears(l);
      if (yrs.some(y => y === 'Volunteer' || y === 'DST')) return false;
      return true;
    }));
    const matches = query
      ? sorted.filter(l => l.name.toLowerCase().includes(query.toLowerCase()))
      : sorted;

    list.innerHTML = '';

    // "All leaders" option when searching
    if (!query) {
      const li = document.createElement('li');
      li.textContent = 'All leaders';
      li.setAttribute('role', 'option');
      li.addEventListener('mousedown', e => { e.preventDefault(); selectLeader(null); });
      list.appendChild(li);
    }

    if (!matches.length) {
      const li = document.createElement('li');
      li.className = 'no-match';
      li.textContent = 'No leaders found';
      list.appendChild(li);
    } else {
      matches.forEach(l => {
        const li = document.createElement('li');
        li.textContent = leaderLabel(l);
        li.setAttribute('role', 'option');
        if (l.id === leaderFilter) li.setAttribute('aria-selected', 'true');
        li.addEventListener('mousedown', e => { e.preventDefault(); selectLeader(l); });
        list.appendChild(li);
      });
    }
    list.classList.remove('hidden');
  }

  function openLeaderDropdown() {
    populateLeaderDropdown(document.getElementById('leader-search').value.trim());
  }

  function onLeaderInput() {
    const q = document.getElementById('leader-search').value.trim();
    if (!q) {
      leaderFilter = null;
      updateExportBtn();
      renderAll();
    }
    populateLeaderDropdown(q);
  }

  function onLeaderBlur() {
    setTimeout(() => {
      document.getElementById('leader-dropdown').classList.add('hidden');
      // If the text doesn't match the selected leader, clear selection
      const input = document.getElementById('leader-search');
      const selected = allLeaders.find(l => l.id === leaderFilter);
      if (!selected && input.value.trim()) {
        input.value = '';
        leaderFilter = null;
        updateExportBtn();
        renderAll();
      }
    }, 150);
  }

  function selectLeader(leader) {
    leaderFilter = leader ? leader.id : null;
    document.getElementById('leader-search').value = leader ? leader.name : '';
    document.getElementById('leader-dropdown').classList.add('hidden');
    updateExportBtn();
    renderAll();
  }

  function updateExportBtn() {
    const btn = document.getElementById('export-pdf-btn');
    const leader = allLeaders.find(l => l.id === leaderFilter);
    btn.textContent = leader ? `Export ${leader.name} PDF` : 'Export PDF';
  }

  function exportPDF() {
    window.print();
  }

  // ─── Data loading ───
  async function loadData() {
    document.getElementById('ld-terms').innerHTML = '<div class="wd-status">Loading…</div>';

    const [leaderRes, rosterRes, entryRes, tsRes, wsRes] = await Promise.all([
      db.from('leaders')
        .select('id, name, year_level, year_levels, gender, active')
        .eq('campus_id', ldCampus)
        .eq('role', 'leader')
        .order('name'),
      db.from('youth_roster')
        .select('leader_id')
        .eq('campus_id', ldCampus)
        .eq('active', true),
      db.from('leader_entries')
        .select('id, leader_id, term, entry_date, attendance_listing, sunday_attendance, connect_attendance, youth_attendance, expected_attendance, late_flags, created_at')
        .eq('campus_id', ldCampus)
        .like('term', `%${ldYear}%`),
      db.from('term_settings')
        .select('*')
        .eq('year', ldYear)
        .or(`campus_id.eq.${ldCampus},campus_id.is.null`),
      db.from('weekly_stats')
        .select('entry_date, term, week_number')
        .eq('campus_id', ldCampus)
        .like('term', `%${ldYear}%`)
        .eq('no_youth_night', true),
    ]);

    allLeaders = leaderRes.data ?? [];
    updateExportBtn();

    rosterCount = {};
    for (const row of (rosterRes.data ?? [])) {
      rosterCount[row.leader_id] = (rosterCount[row.leader_id] ?? 0) + 1;
    }

    allEntries = entryRes.data ?? [];

    const noNightRows = wsRes.data ?? [];
    noNightDates  = new Set(noNightRows.map(r => r.entry_date).filter(Boolean));
    noNightByTerm = {};
    noNightWeeks  = {};
    for (const r of noNightRows) {
      if (!r.term || !r.entry_date) continue;
      if (!noNightByTerm[r.term]) noNightByTerm[r.term] = new Set();
      noNightByTerm[r.term].add(r.entry_date);
      if (r.week_number) {
        if (!noNightWeeks[r.term]) noNightWeeks[r.term] = new Set();
        noNightWeeks[r.term].add(r.week_number);
      }
    }

    // Build term_settings map: prefer campus-specific over null
    termSettingsMap = {};
    for (const row of (tsRes.data ?? [])) {
      const t = row.term_number;
      if (!termSettingsMap[t] || termSettingsMap[t].campus_id === null) {
        termSettingsMap[t] = row;
      }
    }

    renderAll();
  }

  // ─── Week count in localStorage ───
  function getWeekCount(termNum) {
    try {
      return Math.max(1, Math.min(20, parseInt(localStorage.getItem('dy_ld_weeks_T' + termNum + '_' + ldYear) || '10')));
    } catch { return 10; }
  }
  function setWeekCount(termNum, n) {
    try { localStorage.setItem('dy_ld_weeks_T' + termNum + '_' + ldYear, String(Math.max(1, Math.min(20, n)))); }
    catch {}
  }
  function adjustWeeks(termNum, delta) {
    setWeekCount(termNum, getWeekCount(termNum) + delta);
    renderTerm(termNum);
  }

  // ─── Helpers ───
  function avg(vals) {
    const nonNull = vals.filter(v => v != null);
    if (!nonNull.length) return null;
    return nonNull.reduce((s,v) => s+v, 0) / nonNull.length;
  }
  function sum(vals) {
    const nonNull = vals.filter(v => v != null);
    if (!nonNull.length) return null;
    return nonNull.reduce((s,v) => s+v, 0);
  }
  function fmtAvg(v) { return v == null ? '—' : String(Math.round(v)); }
  function fmtSum(v) { return v == null ? '—' : String(v); }
  function fmtVal(v) { return v == null ? '' : String(v); }
  function cellCls(v) { return v == null ? ' empty' : ''; }

  function fmtDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-');
    return parts[2] + '/' + parts[1];
  }

  function getLeaderYears(l) {
    if (Array.isArray(l.year_levels) && l.year_levels.length) return l.year_levels;
    if (l.year_level) return [l.year_level];
    return [];
  }

  function leaderLabel(l) {
    const yrs = getLeaderYears(l);
    const yr = yrs.length ? yrs.map(y => y.replace('Year ', '')).join('/') : '?';
    const gen = l.gender === 'Male' ? ' Boys' : l.gender === 'Female' ? ' Girls' : '';
    return 'Yr ' + yr + gen + ' — ' + l.name;
  }

  function sortLeaders(leaders) {
    const minYrNum = l => {
      const nums = getLeaderYears(l).map(y => { const n = parseInt(y.replace('Year ', '')); return isNaN(n) ? 99 : n; });
      return nums.length ? Math.min(...nums) : 99;
    };
    return [...leaders].sort((a, b) => {
      const yd = minYrNum(a) - minYrNum(b);
      if (yd !== 0) return yd;
      if (a.gender && b.gender && a.gender !== b.gender) return a.gender < b.gender ? -1 : 1;
      return (a.name || '').localeCompare(b.name || '');
    });
  }

  // Returns the YYYY-MM-DD of the overdue entry date only during the window
  // Thursday 9pm → Friday midnight (i.e. before the youth night starts).
  function getOverdueDate() {
    const dow = identity.youth_night_dow ?? 5;
    const now = new Date();
    const entryDateStr = nextYouthNight(now, dow);
    const nextNight = new Date(entryDateStr + 'T00:00:00');
    const due = new Date(nextNight);
    due.setDate(due.getDate() - 1); // Thursday
    due.setHours(21, 0, 0, 0);     // 9pm
    return now > due && now < nextNight ? entryDateStr : null;
  }

  // Build lookup: termKey → entry_date → leaderId → entry
  function buildLookup(entries) {
    const lookup = {};
    for (const e of entries) {
      if (!e.term || !e.entry_date) continue;
      if (!lookup[e.term]) lookup[e.term] = {};
      if (!lookup[e.term][e.entry_date]) lookup[e.term][e.entry_date] = {};
      lookup[e.term][e.entry_date][e.leader_id] = e;
    }
    return lookup;
  }

  // Get sorted unique entry_dates for a term
  function getTermDates(termKey) {
    return [...new Set(allEntries.filter(e => e.term === termKey && e.entry_date).map(e => e.entry_date))].sort();
  }

  // Youth count: prefer manual youth_attendance, fall back to attendance_listing count.
  // Returns null (not 0) when no status has been marked, so unsubmitted weeks show empty.
  function youthCount(entry) {
    if (!entry) return null;
    if (entry.youth_attendance != null) return entry.youth_attendance;
    const al = entry.attendance_listing;
    if (!Array.isArray(al) || !al.length) return null;
    if (!al.some(r => r.status === 'yes' || r.status === 'maybe' || r.status === 'no')) return null;
    return al.filter(r => r.status === 'yes' || r.status === 'maybe').length;
  }

  // Expected attendance: prefer manual override, fall back to attendance_listing length.
  function expectedCount(entry) {
    if (!entry) return null;
    if (entry.expected_attendance != null) return entry.expected_attendance;
    const al = entry.attendance_listing;
    if (Array.isArray(al) && al.length > 0) return al.length;
    return null;
  }

  // ─── Generic save for any leader_entries field ───
  async function saveAttendanceField(input, field) {
    const leaderId  = input.dataset.leaderId;
    const entryDate = input.dataset.entryDate;
    const term      = input.dataset.term;
    const rawVal    = input.value.trim();
    const val       = rawVal === '' ? null : parseInt(rawVal, 10);
    if (rawVal !== '' && isNaN(val)) return;

    input.disabled = true;
    input.style.outline = '';
    const { error } = await db.from('leader_entries').upsert({
      leader_id:  leaderId,
      campus_id:  ldCampus,
      entry_date: entryDate,
      term:       term,
      [field]:    val,
    }, { onConflict: 'leader_id,entry_date' });
    input.disabled = false;

    if (error) {
      input.style.outline = '2px solid #e53e3e';
      console.error('Save failed:', error.message);
    } else {
      input.style.outline = '2px solid #38a169';
      setTimeout(() => { input.style.outline = ''; }, 1000);
      const idx = allEntries.findIndex(e => e.leader_id === leaderId && e.entry_date === entryDate);
      if (idx !== -1) allEntries[idx][field] = val;
      else allEntries.push({ leader_id: leaderId, campus_id: ldCampus, entry_date: entryDate, term, [field]: val });
    }
  }

  function saveYouthAttendance(input)    { saveAttendanceField(input, 'youth_attendance');    }
  function saveSundayAttendance(input)   { saveAttendanceField(input, 'sunday_attendance');   }
  function saveConnectAttendance(input)  { saveAttendanceField(input, 'connect_attendance');  }
  function saveExpectedAttendance(input) { saveAttendanceField(input, 'expected_attendance'); }

  // Returns true if the entry was created after Thursday 9pm of the entry_date week (entry_date is a Friday)
  function isLateExpected(entry) {
    if (!entry?.created_at || !entry?.entry_date) return false;
    const friday = new Date(entry.entry_date + 'T00:00:00');
    const deadline = new Date(friday);
    deadline.setDate(friday.getDate() - 1); // Thursday
    deadline.setHours(21, 0, 0, 0);
    return new Date(entry.created_at) > deadline;
  }

  async function saveLateFlag(btn, field) {
    const td = btn.closest('td');
    const leaderId  = btn.dataset.leaderId;
    const entryDate = btn.dataset.entryDate;
    const term      = btn.dataset.term;
    const idx = allEntries.findIndex(e => e.leader_id === leaderId && e.entry_date === entryDate);
    const currentFlags = (idx !== -1 ? allEntries[idx].late_flags : null) ?? {};
    const newFlags = { ...currentFlags, [field]: !currentFlags[field] };
    const { error } = await db.from('leader_entries').upsert({
      leader_id:  leaderId,
      campus_id:  ldCampus,
      entry_date: entryDate,
      term,
      late_flags: newFlags,
    }, { onConflict: 'leader_id,entry_date' });
    if (!error) {
      if (idx !== -1) allEntries[idx].late_flags = newFlags;
      else allEntries.push({ leader_id: leaderId, campus_id: ldCampus, entry_date: entryDate, term, late_flags: newFlags });
      td.classList.toggle('td-late', !!newFlags[field]);
    }
  }

  // ─── Render ───
  function renderAll() {
    const terms = termFilter.size > 0 ? [...termFilter].sort() : [1,2,3,4];

    const filteredLeaders = sortLeaders(allLeaders.filter(l => {
      if (showInactive ? l.active !== false : l.active === false) return false;
      if (leaderFilter && l.id !== leaderFilter) return false;
      const yrs = getLeaderYears(l);
      if (yrs.some(y => y === 'Volunteer' || y === 'DST')) return false;
      if (yearLevelFilter.size > 0 && !yrs.some(y => yearLevelFilter.has(y))) return false;
      if (genderFilter.size > 0 && !genderFilter.has(l.gender)) return false;
      return true;
    }));

    const lookup = buildLookup(allEntries);

    const termLabels = terms.map(t => 'T' + t).join(', ');
    const yearLevelLabel = yearLevelFilter.size > 0 ? [...yearLevelFilter].join(', ') : 'All year levels';
    const genderLabel = genderFilter.size > 0 ? [...genderFilter].join(', ') : 'All genders';
    document.getElementById('ld-subtitle').textContent =
      termLabels + ' · ' + ldYear + ' · ' + yearLevelLabel + ' · ' + genderLabel;

    const container = document.getElementById('ld-terms');
    container.innerHTML = '';

    if (!filteredLeaders.length) {
      container.innerHTML = '<div class="wd-status">No leaders match the current filters.</div>';
      return;
    }

    terms.forEach(termNum => {
      const el = document.createElement('div');
      el.id = 'ld-block-' + termNum;
      el.className = 'term-block';
      container.appendChild(el);
      renderTermInto(el, termNum, filteredLeaders, lookup);
    });
  }

  function renderTerm(termNum) {
    const el = document.getElementById('ld-block-' + termNum);
    if (!el) return;
    const filteredLeaders = sortLeaders(allLeaders.filter(l => {
      if (showInactive ? l.active !== false : l.active === false) return false;
      if (leaderFilter && l.id !== leaderFilter) return false;
      const yrs = getLeaderYears(l);
      if (yrs.some(y => y === 'Volunteer' || y === 'DST')) return false;
      if (yearLevelFilter.size > 0 && !yrs.some(y => yearLevelFilter.has(y))) return false;
      if (genderFilter.size > 0 && !genderFilter.has(l.gender)) return false;
      return true;
    }));
    const lookup = buildLookup(allEntries);
    renderTermInto(el, termNum, filteredLeaders, lookup);
  }

  function renderTermInto(el, termNum, filteredLeaders, lookup) {
    const termKey    = 'T' + termNum + ' ' + ldYear;
    const overdueDate = ldYear === new Date().getFullYear() ? getOverdueDate() : null;

    const tsRow = termSettingsMap[termNum];
    let weekCount, displayDates;

    if (tsRow) {
      // Term is configured — use the configured dates as the single source of truth.
      // Leader entries are submitted on these exact dates (leader.html uses the same
      // DY.termWeekDates call), so the lookup will match correctly.
      displayDates = DY.termWeekDates(tsRow.first_date, tsRow.num_weeks);
      weekCount    = Math.max(tsRow.num_weeks, displayDates.length);
    } else {
      // No term config: derive columns from actual submission dates + no-night dates
      const noNightForTerm = noNightByTerm[termKey] ?? new Set();
      const actualDates = [...new Set([...getTermDates(termKey), ...noNightForTerm])].sort();
      weekCount = getWeekCount(termNum);
      if (actualDates.length > 0) {
        const known = [...actualDates];
        while (known.length < weekCount) {
          const last = new Date(known[known.length - 1] + 'T00:00:00');
          last.setDate(last.getDate() + 7);
          known.push(formatDateInput(last));
        }
        displayDates = known.slice(0, weekCount);
      } else {
        // No dates at all — generate weekly placeholders ending at the most recent Friday
        const anchor = new Date();
        const daysToFriday = (anchor.getDay() + 7 - 5) % 7;
        anchor.setDate(anchor.getDate() - daysToFriday);
        const dates = [];
        for (let i = weekCount - 1; i >= 0; i--) {
          const d = new Date(anchor);
          d.setDate(anchor.getDate() - i * 7);
          dates.push(formatDateInput(d));
        }
        displayDates = dates;
      }
    }
    const emptyWeekCount = Math.max(0, weekCount - displayDates.length);

    const weeksWithData = displayDates.filter(date =>
      filteredLeaders.some(l => lookup[termKey]?.[date]?.[l.id])
    ).length;

    // ── colgroup ──
    let colsHtml = '<col class="col-label">';
    for (let i = 0; i < weekCount; i++) colsHtml += '<col class="col-week">';
    colsHtml += '<col class="col-total">';

    // ── thead ──
    let wkHeaders = '';
    displayDates.forEach((date, idx) => {
      const wkNum = idx + 1;
      wkHeaders += `<th class="th-week"><span class="wk-label">Wk ${wkNum}</span><span class="wk-num">${fmtDate(date)}</span></th>`;
    });
    for (let i = displayDates.length + 1; i <= weekCount; i++) {
      wkHeaders += `<th class="th-week"><span class="wk-label">Wk ${i}</span><span class="wk-num">—</span></th>`;
    }
    const thead = `<thead><tr>
      <th class="th-label">Leader / Metric</th>
      ${wkHeaders}
      <th class="th-total">Avg</th>
    </tr></thead>`;

    // ── tbody ──
    let tbodyRows = '';
    const colspan = weekCount + 2;

    // ─ Summary section ─
    tbodyRows += `<tr class="section-row"><td colspan="${colspan}">SUMMARY — ALL LEADERS</td></tr>`;

    // Summary: Expected Attendance (per-week, from each leader's submitted attendance_listing)
    {
      const wkExpected = displayDates.map((date, idx) => {
        if (noNightWeeks[termKey]?.has(idx + 1)) return null;
        let total = null;
        for (const l of filteredLeaders) {
          const entry = lookup[termKey]?.[date]?.[l.id] ?? null;
          const v = expectedCount(entry);
          if (v != null) total = (total ?? 0) + v;
        }
        return total;
      });
      const displayCells = wkExpected.map(v =>
        v == null
          ? `<td class="td-week"><span class="cell-val empty"></span></td>`
          : `<td class="td-week"><span class="cell-val">${v}</span></td>`
      ).join('');
      const emptyCells = Array.from({length: emptyWeekCount}, () =>
        `<td class="td-week"><span class="cell-val empty"></span></td>`
      ).join('');
      const currentTotal = filteredLeaders.reduce((s, l) => s + (rosterCount[l.id] ?? 0), 0);
      tbodyRows += `<tr class="data-row">
        <td class="td-label">Expected Attendance</td>
        ${displayCells}${emptyCells}
        <td class="td-total">${currentTotal}</td>
      </tr>`;
    }

    // Summary: Youth Attendance per date
    {
      const wkVals = displayDates.map((date, idx) => {
        if (noNightWeeks[termKey]?.has(idx + 1)) return null;
        let s = null;
        for (const l of filteredLeaders) {
          const entry = lookup[termKey]?.[date]?.[l.id] ?? null;
          const v = youthCount(entry);
          if (v != null) s = (s ?? 0) + v;
        }
        return s;
      });
      const isNoNight = displayDates.map((d, i) => noNightWeeks[termKey]?.has(i + 1) ?? false);
      const emptyCells = Array.from({length: emptyWeekCount}, () =>
        `<td class="td-week"><span class="cell-val empty"></span></td>`
      ).join('');
      const wkCells = wkVals.map((v, i) =>
        isNoNight[i]
          ? `<td class="td-week"><span class="cell-val empty">—</span></td>`
          : `<td class="td-week"><span class="cell-val${cellCls(v)}">${fmtVal(v)}</span></td>`
      ).join('');
      const a = avg(wkVals); const t = sum(wkVals);
      tbodyRows += `<tr class="data-row row-alt">
        <td class="td-label">Youth Attendance</td>
        ${wkCells}${emptyCells}
        <td class="td-total avg${a == null ? ' dash' : ''}">${fmtAvg(a)}</td>
      </tr>`;
    }

    // Summary: Sunday (no-night dates still show data — only youth/expected are struck out)
    {
      const wkVals = displayDates.map(date => {
        let s = null;
        for (const l of filteredLeaders) {
          const entry = lookup[termKey]?.[date]?.[l.id] ?? null;
          if (entry?.sunday_attendance != null) s = (s ?? 0) + entry.sunday_attendance;
        }
        return s;
      });
      const emptyCells = Array.from({length: emptyWeekCount}, () =>
        `<td class="td-week"><span class="cell-val empty"></span></td>`
      ).join('');
      const wkCells = wkVals.map(v =>
        `<td class="td-week"><span class="cell-val${cellCls(v)}">${fmtVal(v)}</span></td>`
      ).join('');
      const a = avg(wkVals); const t = sum(wkVals);
      tbodyRows += `<tr class="data-row">
        <td class="td-label">Sunday</td>
        ${wkCells}${emptyCells}
        <td class="td-total avg${a == null ? ' dash' : ''}">${fmtAvg(a)}</td>
      </tr>`;
    }

    // Summary: Connect Groups (no-night dates still show data)
    {
      const wkVals = displayDates.map(date => {
        let s = null;
        for (const l of filteredLeaders) {
          const entry = lookup[termKey]?.[date]?.[l.id] ?? null;
          if (entry?.connect_attendance != null) s = (s ?? 0) + entry.connect_attendance;
        }
        return s;
      });
      const emptyCells = Array.from({length: emptyWeekCount}, () =>
        `<td class="td-week"><span class="cell-val empty"></span></td>`
      ).join('');
      const wkCells = wkVals.map(v =>
        `<td class="td-week"><span class="cell-val${cellCls(v)}">${fmtVal(v)}</span></td>`
      ).join('');
      const a = avg(wkVals); const t = sum(wkVals);
      tbodyRows += `<tr class="data-row row-alt">
        <td class="td-label">Connect Groups</td>
        ${wkCells}${emptyCells}
        <td class="td-total avg${a == null ? ' dash' : ''}">${fmtAvg(a)}</td>
      </tr>`;
    }

    // ─ Per-leader sections ─
    filteredLeaders.forEach(leader => {
      const exp   = rosterCount[leader.id] ?? 0;
      const label = leaderLabel(leader);
      tbodyRows += `<tr class="leader-row"><td colspan="${colspan}">${label}</td></tr>`;

      // Expected (editable override; falls back to attendance_listing length)
      {
        const esc = s => String(s).replace(/"/g, '&quot;');
        const displayCells = displayDates.map((date, idx) => {
          if (noNightWeeks[termKey]?.has(idx + 1)) return `<td class="td-week"><span class="cell-val empty">—</span></td>`;
          const entry  = lookup[termKey]?.[date]?.[leader.id] ?? null;
          const v      = expectedCount(entry);
          const valStr = v != null ? String(v) : '';
          const late   = isLateExpected(entry);
          return `<td class="td-week${late ? ' td-late' : ''}"><input type="number" class="cell-input"
            value="${esc(valStr)}"
            data-leader-id="${esc(leader.id)}"
            data-entry-date="${esc(date)}"
            data-term="${esc(termKey)}"
            onchange="saveExpectedAttendance(this)"
            min="0" max="999" placeholder=""></td>`;
        }).join('');
        const emptyCells = Array.from({length: emptyWeekCount}, () =>
          `<td class="td-week"><span class="cell-val empty"></span></td>`
        ).join('');
        tbodyRows += `<tr class="data-row">
          <td class="td-label indent">Expected att.</td>
          ${displayCells}${emptyCells}
          <td class="td-total">${exp}</td>
        </tr>`;
      }

      // Youth — editable inputs (dash on no-night dates)
      {
        const esc = s => String(s).replace(/"/g, '&quot;');
        const wkCells = displayDates.map((date, idx) => {
          if (noNightWeeks[termKey]?.has(idx + 1)) return `<td class="td-week"><span class="cell-val empty">—</span></td>`;
          const entry  = lookup[termKey]?.[date]?.[leader.id] ?? null;
          const val    = entry ? youthCount(entry) : null;
          const valStr = val != null ? String(val) : '';
          const isOverdue = overdueDate === date && val == null;
          const isLate = !!(entry?.late_flags?.youth);
          return `<td class="td-week${isOverdue ? ' td-overdue' : ''}${isLate ? ' td-late' : ''}"><input type="number" class="cell-input"
            value="${esc(valStr)}"
            data-leader-id="${esc(leader.id)}"
            data-entry-date="${esc(date)}"
            data-term="${esc(termKey)}"
            onchange="saveYouthAttendance(this)"
            min="0" max="999" placeholder="${isOverdue ? '!' : ''}">
            <button class="late-toggle" title="Mark as late submission"
              data-leader-id="${esc(leader.id)}"
              data-entry-date="${esc(date)}"
              data-term="${esc(termKey)}"
              onclick="saveLateFlag(this,'youth')"></button></td>`;
        }).join('');
        const emptyCells = Array.from({length: emptyWeekCount}, () =>
          `<td class="td-week"><span class="cell-val empty"></span></td>`
        ).join('');
        const wkVals = displayDates.map((date, idx) => {
          if (noNightWeeks[termKey]?.has(idx + 1)) return null;
          const entry = lookup[termKey]?.[date]?.[leader.id] ?? null;
          return entry ? youthCount(entry) : null;
        });
        const a = avg(wkVals); const t = sum(wkVals);
        tbodyRows += `<tr class="data-row row-alt">
          <td class="td-label indent">Youth</td>
          ${wkCells}${emptyCells}
          <td class="td-total avg${a == null ? ' dash' : ''}">${fmtAvg(a)}</td>
        </tr>`;
      }

      // Sunday — editable inputs (no-night dates still show an input)
      {
        const esc = s => String(s).replace(/"/g, '&quot;');
        const wkCells = displayDates.map(date => {
          const entry  = lookup[termKey]?.[date]?.[leader.id] ?? null;
          const val    = entry?.sunday_attendance ?? null;
          const valStr = val != null ? String(val) : '';
          const isLate = !!(entry?.late_flags?.sunday);
          return `<td class="td-week${isLate ? ' td-late' : ''}"><input type="number" class="cell-input"
            value="${esc(valStr)}"
            data-leader-id="${esc(leader.id)}"
            data-entry-date="${esc(date)}"
            data-term="${esc(termKey)}"
            onchange="saveSundayAttendance(this)"
            min="0" max="999" placeholder="">
            <button class="late-toggle" title="Mark as late submission"
              data-leader-id="${esc(leader.id)}"
              data-entry-date="${esc(date)}"
              data-term="${esc(termKey)}"
              onclick="saveLateFlag(this,'sunday')"></button></td>`;
        }).join('');
        const emptyCells = Array.from({length: emptyWeekCount}, () =>
          `<td class="td-week"><span class="cell-val empty"></span></td>`
        ).join('');
        const wkVals = displayDates.map(date => {
          const entry = lookup[termKey]?.[date]?.[leader.id] ?? null;
          return entry?.sunday_attendance ?? null;
        });
        const a = avg(wkVals); const t = sum(wkVals);
        tbodyRows += `<tr class="data-row">
          <td class="td-label indent">Sunday</td>
          ${wkCells}${emptyCells}
          <td class="td-total avg${a == null ? ' dash' : ''}">${fmtAvg(a)}</td>
        </tr>`;
      }

      // Connect groups — editable inputs (no-night dates still show an input)
      {
        const esc = s => String(s).replace(/"/g, '&quot;');
        const wkCells = displayDates.map(date => {
          const entry  = lookup[termKey]?.[date]?.[leader.id] ?? null;
          const val    = entry?.connect_attendance ?? null;
          const valStr = val != null ? String(val) : '';
          const isLate = !!(entry?.late_flags?.connect);
          return `<td class="td-week${isLate ? ' td-late' : ''}"><input type="number" class="cell-input"
            value="${esc(valStr)}"
            data-leader-id="${esc(leader.id)}"
            data-entry-date="${esc(date)}"
            data-term="${esc(termKey)}"
            onchange="saveConnectAttendance(this)"
            min="0" max="999" placeholder="">
            <button class="late-toggle" title="Mark as late submission"
              data-leader-id="${esc(leader.id)}"
              data-entry-date="${esc(date)}"
              data-term="${esc(termKey)}"
              onclick="saveLateFlag(this,'connect')"></button></td>`;
        }).join('');
        const emptyCells = Array.from({length: emptyWeekCount}, () =>
          `<td class="td-week"><span class="cell-val empty"></span></td>`
        ).join('');
        const wkVals = displayDates.map(date => {
          const entry = lookup[termKey]?.[date]?.[leader.id] ?? null;
          return entry?.connect_attendance ?? null;
        });
        const a = avg(wkVals); const t = sum(wkVals);
        tbodyRows += `<tr class="data-row row-alt">
          <td class="td-label indent">Connect groups</td>
          ${wkCells}${emptyCells}
          <td class="td-total avg${a == null ? ' dash' : ''}">${fmtAvg(a)}</td>
        </tr>`;
      }
    });

    // ── Assemble ──
    const noDatesBanner = (!tsRow && displayDates.length === 0)
      ? `<div style="padding:var(--s-4) var(--s-5);background:rgba(255,180,0,0.12);border-bottom:1px solid rgba(255,180,0,0.25);font-size:12px;color:#b8860b">
           No entries or term dates found for this term.
           <a href="settings.html" style="color:inherit;font-weight:700;text-decoration:underline;margin-left:4px">Configure term dates in Settings</a> to enable editing.
         </div>`
      : '';

    const weekControlsHtml = tsRow
      ? `<span class="term-meta" style="font-style:italic">term dates configured</span>`
      : `<div class="week-controls">
          <button class="wk-btn" onclick="adjustWeeks(${termNum}, -1)" ${weekCount <= 1 ? 'disabled' : ''}>−</button>
          <button class="wk-btn" onclick="adjustWeeks(${termNum}, +1)" ${weekCount >= 20 ? 'disabled' : ''}>+</button>
        </div>`;
    el.innerHTML = `
      <div class="term-header">
        <span class="term-name">TERM ${termNum} ${ldYear}</span>
        <span class="term-meta">${weekCount} weeks · ${weeksWithData} with data</span>
        ${weekControlsHtml}
      </div>
      ${noDatesBanner}
      <div class="table-wrap">
        <table class="wd-table">
          <colgroup>${colsHtml}</colgroup>
          ${thead}
          <tbody>${tbodyRows}</tbody>
        </table>
      </div>
    `;
  }

  init();
</script>
</body>
</html>
