<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Data — Dreamers Youth</title>
  <link rel="stylesheet" href="shared.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
  <script src="shared.js"></script>
  <style>
    body { background: #0d0d0d; }

    /* ─── Weekly-data CSS vars ─── */
    :root {
      --wd-blue: #1500E8;
      --wd-blue-dim: rgba(21,0,232,0.07);
      --wd-surface: #FFFFFF;
      --wd-border: #E2E2EA;
      --wd-text: #111118;
      --wd-text-muted: #65657A;
      --wd-text-faint: #ABABC0;
      --wd-alt-row: #F8F8FB;
      --wd-section-bg: #EDEDF4;
      --wd-section-text: #8888A0;
      --wd-total-bg: #F4F4FA;
      --wd-shadow: rgba(0,0,20,0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --wd-surface: #141420;
        --wd-border: #252535;
        --wd-text: #EEEEF8;
        --wd-text-muted: #8888A8;
        --wd-text-faint: #55556A;
        --wd-alt-row: #111120;
        --wd-section-bg: #1A1A28;
        --wd-section-text: #6868A0;
        --wd-total-bg: #161626;
        --wd-shadow: rgba(0,0,0,0.3);
      }
    }
    :root[data-theme="dark"] {
      --wd-surface: #141420;
      --wd-border: #252535;
      --wd-text: #EEEEF8;
      --wd-text-muted: #8888A8;
      --wd-text-faint: #55556A;
      --wd-alt-row: #111120;
      --wd-section-bg: #1A1A28;
      --wd-section-text: #6868A0;
      --wd-total-bg: #161626;
      --wd-shadow: rgba(0,0,0,0.3);
    }

    /* ─── Filter bar ─── */
    .wd-filter-bar {
      display: flex;
      align-items: flex-end;
      gap: var(--s-4);
      flex-wrap: wrap;
      margin-bottom: var(--s-6);
    }
    .wd-filter-group { display: flex; flex-direction: column; gap: 4px; }
    .wd-filter-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--c-text-muted);
    }
    .wd-select {
      height: 38px;
      padding: 0 var(--s-3);
      border: 1px solid var(--c-border);
      border-radius: var(--r-md);
      background: var(--c-surface);
      color: var(--c-text);
      font-size: var(--text-sm);
      cursor: pointer;
      min-width: 140px;
    }

    /* ─── Term blocks ─── */
    .term-block {
      background: var(--wd-surface);
      border: 1px solid var(--wd-border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .term-header {
      background: var(--wd-blue);
      color: #fff;
      height: 46px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }
    .term-name { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; flex: 1; }
    .term-meta { font-size: 11px; font-weight: 500; opacity: 0.6; margin-right: 6px; }
    .week-controls { display: none; }

    /* ─── Table ─── */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .wd-table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 13px;
    }
    .td-label, .th-label {
      position: sticky; left: 0; z-index: 2;
    }
    .td-label::after, .th-label::after {
      content: '';
      position: absolute;
      top: 0; right: -5px; bottom: 0; width: 5px;
      background: linear-gradient(to right, var(--wd-shadow), transparent);
      pointer-events: none;
    }
    .col-label { width: 210px; }
    .col-week  { width: 72px; }
    .col-total { width: 80px; }

    .wd-table thead tr { border-bottom: 1.5px solid var(--wd-border); }
    .wd-table thead th {
      padding: 9px 10px 8px;
      font-size: 11px; font-weight: 600;
      color: var(--wd-text-muted);
      text-align: right; white-space: nowrap;
      vertical-align: bottom;
      background: var(--wd-surface);
      letter-spacing: 0.01em;
    }
    .th-label {
      text-align: left !important;
      font-size: 11px; font-weight: 700;
      color: var(--wd-text);
      background: var(--wd-surface);
      padding-left: 16px; z-index: 3;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .th-week { vertical-align: bottom; padding-bottom: 6px; }
    .wk-num { display: block; font-size: 11px; font-weight: 600; color: var(--wd-text); letter-spacing: 0.01em; }
    .wk-date { display: block; font-size: 9px; font-weight: 500; color: var(--wd-text-faint); margin-top: 1px; }
    .wk-sub { display: block; font-size: 9px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--wd-text-faint); margin-top: 2px; }
    .th-week.no-night .wk-num { color: var(--wd-text-faint); }
    .th-week.no-night .wk-date { color: var(--wd-text-faint); }
    .th-week.no-night .wk-sub { color: #D97706; }
    .th-total { background: var(--wd-total-bg) !important; font-weight: 700; color: var(--wd-text); }

    .wd-table tr.section-row td {
      background: var(--wd-section-bg);
      padding: 7px 10px 6px 16px;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--wd-section-text);
      text-transform: uppercase;
      border-top: 1px solid var(--wd-border);
    }
    .wd-table tr.data-row { border-bottom: 1px solid var(--wd-border); }
    .wd-table tr.data-row:last-child { border-bottom: none; }
    .wd-table tr.data-row td { height: 36px; vertical-align: middle; font-variant-numeric: tabular-nums; }

    .td-label {
      background: var(--wd-surface);
      padding: 0 14px 0 16px;
      font-size: 13px; font-weight: 400;
      color: var(--wd-text);
      white-space: nowrap;
      position: relative;
    }
    .wd-table tr.row-alt .td-label { background: var(--wd-alt-row); }

    .td-week {
      text-align: right; padding: 0;
      background: var(--wd-surface); position: relative;
    }
    .wd-table tr.row-alt .td-week { background: var(--wd-alt-row); }
    .td-week.no-night { /* no background change — just show dash */ }

    .td-week .cell-val {
      display: block; text-align: right;
      padding: 0 10px; height: 36px; line-height: 36px;
      font-size: 13px; color: var(--wd-text); white-space: nowrap;
    }
    .td-week .cell-val.empty { color: var(--wd-text-faint); }
    .td-week.no-night .cell-val { color: var(--wd-text-faint); text-align: center; padding: 0; }

    .td-total {
      background: var(--wd-total-bg);
      text-align: right; padding: 0 12px;
      font-variant-numeric: tabular-nums;
      font-size: 13px; font-weight: 700; color: var(--wd-text);
    }
    .td-total.dash { font-weight: 400; color: var(--wd-text-faint); }
    .td-total.zero { color: var(--wd-text-faint); font-weight: 400; }
    .td-total.avg  { font-style: italic; }

    /* ─── Loading / empty ─── */
    .wd-status { padding: 48px; text-align: center; color: var(--c-text-muted); font-size: var(--text-sm); }

    /* ─── Print ─── */
    @media print {
      @page { size: A4 landscape; margin: 10mm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .sidebar { display: none !important; }
      .main-content { margin-left: 0 !important; width: 100% !important; }
      .wd-filter-bar, .btn, button, .snap-header-actions { display: none !important; }
      .app-layout { display: block; }
      .week-controls { display: none !important; }
      .term-block { border-radius: 5px !important; margin-bottom: 6mm !important; break-inside: avoid; page-break-inside: avoid; overflow: visible !important; }
      .term-header { height: 32px !important; background: #1500E8 !important; border-radius: 5px 5px 0 0 !important; }
      .table-wrap { overflow: visible !important; }
      .wd-table { width: 100% !important; table-layout: fixed !important; }
      .th-label, .td-label { display: none !important; }
      .col-label { display: none !important; }
      .col-week  { width: 50px !important; }
      .col-total { width: 60px !important; }
      .wd-table tr.data-row td { height: 24px !important; }
      .wd-table tr.section-row td { padding: 4px 8px 3px 12px !important; font-size: 8px !important; background: #EDEDF4 !important; }
      .wd-table thead th { font-size: 9px !important; padding: 6px 6px 5px !important; background: #FFFFFF !important; }
      .th-total { background: #F4F4FA !important; }
      .wk-num { font-size: 9px !important; }
      .td-week .cell-val { font-size: 9px !important; height: 24px !important; line-height: 24px !important; padding: 0 6px !important; }
      .td-total { background: #F4F4FA !important; padding: 0 6px !important; font-size: 9px !important; }
    }
  </style>
</head>
<body>
<div class="app-layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <img src="dy-logo-white.png" class="sidebar__logo-img" alt="DY">
      <button class="sidebar-toggle" onclick="DY.toggleSidebar()" title="Toggle sidebar"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,3 4,8 10,13"/></svg></button>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-section__label">Overview</span>
      <a class="sidebar-nav-item" href="dashboard.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        Dashboard
      </a>
      <a class="sidebar-nav-item" href="dashboard.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="1,11 5,6 9,9 15,3"/><polyline points="1,14 5,9 9,12 15,6"/></svg>
        Year comparison
      </a>
      <a class="sidebar-nav-item active" href="weekly-data.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="14" height="4" rx="0.5"/><rect x="1" y="7" width="14" height="4" rx="0.5"/><rect x="1" y="13" width="14" height="2" rx="0.5"/></svg>
        Weekly data
      </a>
      <a class="sidebar-nav-item" href="listing-data.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="10" y2="12"/></svg>
        Listing data
      </a>
    </div>

    <div class="sidebar-section">
      <span class="sidebar-section__label">People</span>
      <a class="sidebar-nav-item" href="new-people.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="5" r="3"/><path d="M1 13c0-2.8 2.2-5 5-5h0c2.8 0 5 2.2 5 5"/><line x1="12" y1="5" x2="15" y2="5"/><line x1="13.5" y1="3.5" x2="13.5" y2="6.5"/></svg>
        New People
      </a>
      <a class="sidebar-nav-item" href="new-christians.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L9.5 6h4.5l-3.6 2.6 1.4 4.4L8 10.5 4.2 13l1.4-4.4L2 6h4.5z"/></svg>
        New Christians
      </a>
      <a class="sidebar-nav-item" href="leaders.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="4" r="2.5"/><circle cx="11" cy="4" r="2.5"/><path d="M1 13c0-2.2 1.8-4 4-4h2"/><path d="M9 9h2c2.2 0 4 1.8 4 4"/><line x1="11" y1="11" x2="11" y2="15"/><line x1="9" y1="13" x2="13" y2="13"/></svg>
        Leaders
      </a>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-section__label">Admin</span>
      <a class="sidebar-nav-item" href="settings.html">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M11.54 4.46l-1.41 1.41M4.46 11.54l-1.41 1.41"/></svg>
        Settings
      </a>
    </div>

    <button class="sidebar-logout-icon" onclick="DY.clearIdentity(); window.location.href='/'" title="Sign out">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/><polyline points="11,11 14,8 11,5"/><line x1="14" y1="8" x2="6" y2="8"/></svg>
    </button>
    <div class="sidebar-bottom">
      <span class="sidebar-bottom__label">Campus</span>
      <div class="sidebar-campus-switcher" id="sidebar-campus-switcher"></div>
      <div class="sidebar-bottom__sub" id="sidebar-user">—</div>
      <button class="sidebar-logout" onclick="DY.clearIdentity(); window.location.href='/'">Sign out</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main-content">
    <div class="main-content__body">

      <div class="snap-header">
        <div>
          <h1 class="snap-title">Weekly data</h1>
          <div class="snap-subtitle" id="wd-subtitle">Loading…</div>
        </div>
        <div class="snap-header-actions">
          <button class="btn btn--outline btn--sm" onclick="window.print()">Export PDF</button>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="wd-filter-bar">
        <div class="wd-filter-group">
          <label class="wd-filter-label">Campus</label>
          <select id="wd-campus" class="wd-select" onchange="onFilterChange()">
            <option value="all">All campuses</option>
          </select>
        </div>
        <div class="wd-filter-group">
          <label class="wd-filter-label">Year</label>
          <select id="wd-year" class="wd-select" onchange="onFilterChange()"></select>
        </div>
        <div class="wd-filter-group">
          <label class="wd-filter-label">Term</label>
          <select id="wd-term" class="wd-select" onchange="onFilterChange()">
            <option value="all">All terms</option>
            <option value="1">Term 1</option>
            <option value="2">Term 2</option>
            <option value="3">Term 3</option>
            <option value="4">Term 4</option>
          </select>
        </div>
      </div>

      <div id="wd-terms">
        <div class="wd-status">Loading…</div>
      </div>

    </div>
  </div>
</div>

<script>
  const { db } = DY;
  const identity = requireIdentity('pastor');
  if (!identity) throw new Error('not authenticated');

  let wdYear   = new Date().getFullYear();
  let wdCampus = 'all';
  let wdTerm   = 'all';
  let wdStats     = [];
  let allCampuses = [];
  let ncByDate    = {};

  // ─── Row definitions ───
  // avg:true     → summary column shows average (not sum)
  // noTotal:true → summary column shows — (no meaningful aggregate)
  // computed:true, kind → special render logic
  const SECTIONS = [
    { key: 'attendance', label: 'ATTENDANCE', rows: [
      { key: 'youth_attendance',    label: 'Youth attendance',    avg: true, suppressOnNoNight: true },
      { key: 'total_in_department', label: 'Total in department', noTotal: true },
      { key: 'leaders_count',       label: 'Total leaders',       avg: true },
      { key: 'ratio',               label: 'Ratio',               computed: true, kind: 'ratio' },
    ]},
    { key: 'life', label: 'DISCIPLESHIP STEPS', rows: [
      { key: 'salvations_first',  label: 'First-time decisions', suppressOnNoNight: true },
      { key: 'salvations_rededs', label: 'Rededications',        suppressOnNoNight: true },
      { key: 'bibles_given',      label: 'Bibles given'         },
      { key: 'fresh_start',       label: 'Fresh Start'          },
      { key: 'water_baptisms',    label: 'Water baptisms'       },
      { key: 'hs_baptisms',       label: 'Baptised in HS'       },
    ]},
    { key: 'connect', label: 'CONNECT & SUNDAY', rows: [
      { key: 'connect_attendance',  label: 'Connect group att.',  avg: true },
      { key: 'sunday_attendance',   label: 'Sunday AM att.',      avg: true },
      { key: 'saints_attendance',   label: 'Saints',              avg: true },
      { key: 'schools_visited',     label: 'School engagements' },
    ]},
  ];

  const NUMERIC_FIELDS = [
    'total_in_department','leaders_count','connect_attendance',
    'salvations_first','salvations_rededs','bibles_given','fresh_start',
    'water_baptisms','hs_baptisms','sunday_attendance','saints_attendance','schools_visited','youth_attendance'
  ];

  // ─── Init ───
  async function init() {
    DY.initSidebar();
    document.getElementById('sidebar-user').textContent = identity.leader_name || '—';

    const { data: campusData } = await db.from('campuses').select('id, name').order('name');
    allCampuses = campusData ?? [];

    const campusSel = document.getElementById('wd-campus');
    allCampuses.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      campusSel.appendChild(opt);
    });
    if (identity.campus_id) {
      campusSel.value = identity.campus_id;
      wdCampus = identity.campus_id;
    }

    // Sidebar campus switcher
    const switcher = document.getElementById('sidebar-campus-switcher');
    if (switcher) {
      const allBtn = document.createElement('button');
      allBtn.className = 'campus-switcher-btn campus-switcher-btn--all' + (wdCampus === 'all' ? ' active' : '');
      allBtn.textContent = 'All Campuses';
      allBtn.onclick = () => setSidebarCampus('all');
      switcher.appendChild(allBtn);
      allCampuses.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'campus-switcher-btn' + (wdCampus === c.id ? ' active' : '');
        btn.textContent = c.name;
        btn.dataset.campusId = c.id;
        btn.onclick = () => setSidebarCampus(c.id);
        switcher.appendChild(btn);
      });
    }

    const yearSel = document.getElementById('wd-year');
    const curr = new Date().getFullYear();
    for (let y = curr + 1; y >= curr - 3; y--) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      if (y === curr) opt.selected = true;
      yearSel.appendChild(opt);
    }
    wdYear = curr;

    await loadWeeklyData();
  }

  function onFilterChange() {
    wdCampus = document.getElementById('wd-campus').value;
    wdYear   = parseInt(document.getElementById('wd-year').value);
    wdTerm   = document.getElementById('wd-term').value;
    loadWeeklyData();
  }

  function setSidebarCampus(id) {
    wdCampus = id;
    const campusSel = document.getElementById('wd-campus');
    if (campusSel) campusSel.value = id;
    document.querySelectorAll('#sidebar-campus-switcher .campus-switcher-btn').forEach(btn => {
      btn.classList.toggle('active',
        id === 'all' ? btn.classList.contains('campus-switcher-btn--all') : btn.dataset.campusId === id
      );
    });
    loadWeeklyData();
  }

  // ─── Load data from Supabase ───
  let ldEntriesMap = {}; // entry_date → { connect: sum, sunday: sum }

  async function loadWeeklyData() {
    document.getElementById('wd-terms').innerHTML = '<div class="wd-status">Loading…</div>';

    let q = db.from('weekly_stats').select('*').like('term', `%${wdYear}%`);
    if (wdCampus !== 'all') q = q.eq('campus_id', wdCampus);

    let leq = db.from('leader_entries')
      .select('entry_date, connect_attendance, sunday_attendance, youth_attendance')
      .like('term', `%${wdYear}%`);
    if (wdCampus !== 'all') leq = leq.eq('campus_id', wdCampus);

    let ncq = db.from('new_christians')
      .select('decision_date, decision_type')
      .eq('archived', false)
      .gte('decision_date', `${wdYear}-01-01`)
      .lte('decision_date', `${wdYear}-12-31`);
    if (wdCampus !== 'all') ncq = ncq.eq('campus_id', wdCampus);

    const [{ data: curr }, { data: leData }, { data: ncData }] = await Promise.all([q, leq, ncq]);
    await loadTermSettings();

    wdStats = curr ?? [];

    // Build decision_date → {first_time, rededication} counts
    ncByDate = {};
    for (const nc of (ncData ?? [])) {
      if (!nc.decision_date) continue;
      if (!ncByDate[nc.decision_date]) ncByDate[nc.decision_date] = { first_time: 0, rededication: 0 };
      if (nc.decision_type === 'first_time') ncByDate[nc.decision_date].first_time++;
      else if (nc.decision_type === 'rededication') ncByDate[nc.decision_date].rededication++;
    }

    // Build entry_date → summed connect/sunday/youth from leader entries
    ldEntriesMap = {};
    for (const e of (leData ?? [])) {
      if (!e.entry_date) continue;
      if (!ldEntriesMap[e.entry_date]) ldEntriesMap[e.entry_date] = { connect: null, sunday: null, youth: null };
      if (e.connect_attendance != null)
        ldEntriesMap[e.entry_date].connect = (ldEntriesMap[e.entry_date].connect ?? 0) + e.connect_attendance;
      if (e.sunday_attendance != null)
        ldEntriesMap[e.entry_date].sunday = (ldEntriesMap[e.entry_date].sunday ?? 0) + e.sunday_attendance;
      if (e.youth_attendance != null)
        ldEntriesMap[e.entry_date].youth = (ldEntriesMap[e.entry_date].youth ?? 0) + e.youth_attendance;
    }

    renderAllTerms();
  }

  // ─── Aggregate entries for a given term+week ───
  function getWeekAgg(statsArr, termNum, weekNum) {
    const termKey = 'T' + termNum;
    const entries = statsArr.filter(e => e.term && e.term.startsWith(termKey) && e.week_number === weekNum);
    if (!entries.length) return null;
    const noNight = entries.every(e => e.no_youth_night);
    const agg = { no_youth_night: noNight };
    for (const field of NUMERIC_FIELDS) {
      let total = null;
      for (const e of entries) {
        if (e[field] != null) total = (total ?? 0) + Number(e[field]);
      }
      agg[field] = total;
    }
    // Override connect/sunday/youth with sums from leader_entries (listing data)
    const entryDates = [...new Set(entries.map(e => e.entry_date).filter(Boolean))];
    let connectSum = null, sundaySum = null, youthSum = null;
    for (const date of entryDates) {
      const le = ldEntriesMap[date];
      if (le?.connect != null) connectSum = (connectSum ?? 0) + le.connect;
      if (le?.sunday  != null) sundaySum  = (sundaySum  ?? 0) + le.sunday;
      if (le?.youth   != null) youthSum   = (youthSum   ?? 0) + le.youth;
    }
    agg.connect_attendance = connectSum;
    agg.sunday_attendance  = sundaySum;
    agg.youth_attendance   = youthSum;

    // Override salvations from new_christians (keyed by decision_date)
    const weekDate = getWeekDate(termNum, weekNum);
    const ncDates = new Set([...entryDates, ...(weekDate ? [weekDate] : [])]);
    let firstTime = null, rededics = null;
    for (const date of ncDates) {
      const nc = ncByDate[date];
      if (nc?.first_time)   firstTime = (firstTime ?? 0) + nc.first_time;
      if (nc?.rededication) rededics  = (rededics  ?? 0) + nc.rededication;
    }
    agg.salvations_first  = firstTime;
    agg.salvations_rededs = rededics;

    return agg;
  }

  // Sum a field across week data array; skipNoNight=true excludes no-night weeks
  function sumField(weekDataArr, field, skipNoNight = false) {
    let t = null;
    for (const wd of weekDataArr) {
      if (wd && (skipNoNight ? !wd.no_youth_night : true) && wd[field] != null) {
        t = (t ?? 0) + Number(wd[field]);
      }
    }
    return t;
  }

  // Average a field across week data array; skipNoNight=true excludes no-night weeks
  function avgField(weekDataArr, field, skipNoNight = false) {
    let sum = 0, count = 0;
    for (const wd of weekDataArr) {
      if (wd && (skipNoNight ? !wd.no_youth_night : true) && wd[field] != null) {
        sum += Number(wd[field]);
        count++;
      }
    }
    return count > 0 ? Math.round(sum / count) : null;
  }

  // ─── Term week count and dates from term_settings ───
  let termWeekCount = { 1: 10, 2: 10, 3: 10, 4: 10 };
  let termFirstDate = {}; // termNum → first_date string

  function getWeekDate(termNum, weekNum) {
    const fd = termFirstDate[termNum];
    if (!fd) return null;
    const d = new Date(fd + 'T00:00:00');
    d.setDate(d.getDate() + (weekNum - 1) * 7);
    return d.toISOString().slice(0, 10);
  }

  async function loadTermSettings() {
    let q = db.from('term_settings')
      .select('term_number, num_weeks, first_date, campus_id')
      .eq('year', wdYear);
    if (wdCampus !== 'all') {
      q = q.or(`campus_id.eq.${wdCampus},campus_id.is.null`);
    }
    const { data: tsRows } = await q;
    termWeekCount = { 1: 10, 2: 10, 3: 10, 4: 10 };
    termFirstDate = {};
    // Track best row per term: prefer campus-specific over global (null campus_id)
    const best = {};
    (tsRows ?? []).forEach(ts => {
      const t = ts.term_number;
      if (!best[t] || best[t].campus_id === null) best[t] = ts;
    });
    Object.values(best).forEach(ts => {
      termWeekCount[ts.term_number] = ts.num_weeks ?? 10;
      if (ts.first_date) termFirstDate[ts.term_number] = ts.first_date;
    });
  }

  // ─── Render all visible terms ───
  function renderAllTerms() {
    const terms = wdTerm === 'all' ? [1, 2, 3, 4] : [parseInt(wdTerm)];
    const container = document.getElementById('wd-terms');
    container.innerHTML = '';

    const campusName = wdCampus === 'all'
      ? 'All campuses'
      : (allCampuses.find(c => c.id === wdCampus)?.name ?? 'Campus');
    const termLabel = wdTerm === 'all' ? 'All terms' : 'Term ' + wdTerm;
    document.getElementById('wd-subtitle').textContent = termLabel + ' · ' + campusName + ' · ' + wdYear;

    terms.forEach(t => {
      const el = document.createElement('div');
      el.id = 'term-block-' + t;
      el.className = 'term-block';
      container.appendChild(el);
      renderTermInto(el, t);
    });
  }

  function renderTerm(termNum) {
    const el = document.getElementById('term-block-' + termNum);
    if (!el) return;
    renderTermInto(el, termNum);
  }

  // ─── Render a single term block ───
  function renderTermInto(el, termNum) {
    const weekCount = termWeekCount[termNum] ?? 10;

    // Build per-week aggregated data
    const weekData = [];
    for (let w = 1; w <= weekCount; w++) {
      weekData.push(getWeekAgg(wdStats, termNum, w));
    }
    const weeksWithData = weekData.filter(w => w !== null).length;

    // ── Build column group ──
    const colsHtml = '<col class="col-label">' +
      Array.from({length: weekCount}, () => '<col class="col-week">').join('') +
      '<col class="col-total">';

    // ── Build thead ──
    const fd = termFirstDate[termNum];
    const weekDates = fd ? DY.termWeekDates(fd, weekCount) : [];
    const fmtWkDate = iso => {
      if (!iso) return '';
      const p = iso.split('-');
      return p[2] + '/' + p[1];
    };
    const wkHeaders = Array.from({length: weekCount}, (_, i) => {
      const wd = weekData[i];
      const isNN = wd?.no_youth_night ?? false;
      const dateStr = weekDates[i] ? fmtWkDate(weekDates[i]) : '';
      return `<th class="th-week${isNN ? ' no-night' : ''}">` +
        `<span class="wk-num">Wk ${i + 1}</span>` +
        (dateStr ? `<span class="wk-date">${dateStr}</span>` : '') +
        (isNN ? '<span class="wk-sub">no night</span>' : '') +
        '</th>';
    }).join('');

    const thead = `<thead><tr>
      <th class="th-label">Metric</th>
      ${wkHeaders}
      <th class="th-total">Total / Avg</th>
    </tr></thead>`;

    // ── Build tbody ──
    let altIdx = 0;
    let tbodyRows = '';

    SECTIONS.forEach(section => {
      const colspan = weekCount + 2;
      tbodyRows += `<tr class="section-row"><td colspan="${colspan}">${section.label}</td></tr>`;

      section.rows.forEach(row => {
        const isAlt = altIdx++ % 2 === 1;
        const rowCls = 'data-row' + (isAlt ? ' row-alt' : '');

        if (row.computed) {
          let summaryStr = '—', summaryCls = ' dash';
          let wkCells = '';

          if (row.kind === 'retention') {
            const ft = sumField(weekData, 'first_timers');
            const tt = sumField(weekData, 'third_timers');
            summaryStr = (ft != null && ft > 0) ? Math.round((tt ?? 0) / ft * 100) + '%' : '—';
            summaryCls = summaryStr === '—' ? ' dash' : '';
            wkCells = Array.from({length: weekCount}, (_, i) => {
              const wd = weekData[i];
              if (!wd) return '<td class="td-week"><span class="cell-val empty"></span></td>';
              if (wd.no_youth_night) return '<td class="td-week no-night"><span class="cell-val">—</span></td>';
              const f = wd.first_timers, t2 = wd.third_timers;
              const val = (f != null && f > 0) ? Math.round((t2 ?? 0) / f * 100) + '%' : null;
              return `<td class="td-week"><span class="cell-val${val == null ? ' empty' : ''}">${val ?? ''}</span></td>`;
            }).join('');

          } else if (row.kind === 'ratio') {
            const fmtRatio = (leaders, att) => {
              if (leaders == null || att == null || leaders === 0) return null;
              const r = Math.round(att / leaders);
              return `1:${r}`;
            };
            const wkRatios = weekData.map(wd => {
              if (!wd || wd.no_youth_night) return wd;
              return { ...wd, _ratio: fmtRatio(wd.leaders_count, wd.total_in_department) };
            });
            const validRatios = wkRatios.filter(w => w && !w.no_youth_night && w._ratio != null);
            summaryStr = validRatios.length
              ? fmtRatio(
                  avgField(weekData.filter(w => w && !w.no_youth_night), 'leaders_count'),
                  avgField(weekData.filter(w => w && !w.no_youth_night), 'total_in_department')
                ) ?? '—'
              : '—';
            summaryCls = summaryStr === '—' ? ' dash' : '';
            wkCells = wkRatios.map(wd => {
              if (!wd) return '<td class="td-week"><span class="cell-val empty"></span></td>';
              if (wd.no_youth_night) return '<td class="td-week no-night"><span class="cell-val">—</span></td>';
              const val = wd._ratio;
              return `<td class="td-week"><span class="cell-val${val == null ? ' empty' : ''}">${val ?? ''}</span></td>`;
            }).join('');

          } else if (row.kind === 'total_np') {
            // Per week: sum of 1st+2nd+3rd timers
            const wkNP = weekData.map(wd => {
              if (!wd) return null;
              const a = wd.first_timers, b = wd.second_timers, c = wd.third_timers;
              if (a == null && b == null && c == null) return { ...wd, _total_np: null };
              return { ...wd, _total_np: (a ?? 0) + (b ?? 0) + (c ?? 0) };
            });
            const totalNP = sumField(wkNP, '_total_np');
            summaryStr = totalNP != null ? String(totalNP) : '—';
            summaryCls = totalNP == null ? ' dash' : totalNP === 0 ? ' zero' : '';
            wkCells = wkNP.map(wd => {
              if (!wd) return '<td class="td-week"><span class="cell-val empty"></span></td>';
              if (wd.no_youth_night) return '<td class="td-week no-night"><span class="cell-val">—</span></td>';
              const val = wd._total_np;
              return `<td class="td-week"><span class="cell-val${val == null ? ' empty' : ''}">${val ?? ''}</span></td>`;
            }).join('');
          }

          tbodyRows += `<tr class="${rowCls}">
            <td class="td-label">${row.label}</td>
            ${wkCells}
            <td class="td-total${summaryCls}">${summaryStr}</td>
          </tr>`;
          return;
        }

        if (row.noTotal) {
          // No aggregate — show — in summary column
          const wkCells = Array.from({length: weekCount}, (_, i) => {
            const wd = weekData[i];
            if (!wd) return '<td class="td-week"><span class="cell-val empty"></span></td>';
            if (wd.no_youth_night && row.suppressOnNoNight) return '<td class="td-week no-night"><span class="cell-val">—</span></td>';
            const val = wd[row.key];
            return `<td class="td-week"><span class="cell-val${val == null ? ' empty' : ''}">${val ?? ''}</span></td>`;
          }).join('');
          tbodyRows += `<tr class="${rowCls}">
            <td class="td-label">${row.label}</td>
            ${wkCells}
            <td class="td-total dash">—</td>
          </tr>`;
          return;
        }

        if (row.avg) {
          // Average in summary column
          const avgVal = avgField(weekData, row.key, row.suppressOnNoNight);
          const wkCells = Array.from({length: weekCount}, (_, i) => {
            const wd = weekData[i];
            if (!wd) return '<td class="td-week"><span class="cell-val empty"></span></td>';
            if (wd.no_youth_night && row.suppressOnNoNight) return '<td class="td-week no-night"><span class="cell-val">—</span></td>';
            const val = wd[row.key];
            return `<td class="td-week"><span class="cell-val${val == null ? ' empty' : ''}">${val ?? ''}</span></td>`;
          }).join('');
          tbodyRows += `<tr class="${rowCls}">
            <td class="td-label">${row.label}</td>
            ${wkCells}
            <td class="td-total avg${avgVal == null ? ' dash' : avgVal === 0 ? ' zero' : ''}">${avgVal ?? '—'}</td>
          </tr>`;
          return;
        }

        // Default: sum in summary column
        const total = sumField(weekData, row.key, row.suppressOnNoNight);
        const wkCells = Array.from({length: weekCount}, (_, i) => {
          const wd = weekData[i];
          if (!wd) return '<td class="td-week"><span class="cell-val empty"></span></td>';
          if (wd.no_youth_night && row.suppressOnNoNight) return '<td class="td-week no-night"><span class="cell-val">—</span></td>';
          const val = wd[row.key];
          return `<td class="td-week"><span class="cell-val${val == null ? ' empty' : ''}">${val ?? ''}</span></td>`;
        }).join('');
        tbodyRows += `<tr class="${rowCls}">
          <td class="td-label">${row.label}</td>
          ${wkCells}
          <td class="td-total${total == null ? ' dash' : total === 0 ? ' zero' : ''}">${total ?? '—'}</td>
        </tr>`;
      });
    });

    el.innerHTML = `
      <div class="term-header">
        <span class="term-name">TERM ${termNum}</span>
        <span class="term-meta">${weekCount} weeks · ${weeksWithData} with data</span>
      </div>
      <div class="table-wrap">
        <table class="wd-table">
          <colgroup>${colsHtml}</colgroup>
          ${thead}
          <tbody>${tbodyRows}</tbody>
        </table>
      </div>`;
  }

  init();
</script>
</body>
</html>
